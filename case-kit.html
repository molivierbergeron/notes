<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PM Case Exercise</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one reading column; tabs switch between how-to, two case briefs and the evaluation sheet. */
:root{
--bg:#f3f4f6; --paper:#ffffff; --fg:#1b2230; --muted:#5b6474; --line:#d9dde4;
--accent:#1f5f74; --accent-soft:#e3eef2; --key:#8a5a12; --key-soft:#fbf1df;
--display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
--body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
--mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--bg:#12161d; --paper:#1a2029; --fg:#e4e8ee; --muted:#9aa3b2; --line:#2e3644;
--accent:#7fc0d4; --accent-soft:#1d313a; --key:#e3b56a; --key-soft:#2d2416; color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#12161d; --paper:#1a2029; --fg:#e4e8ee; --muted:#9aa3b2; --line:#2e3644;
--accent:#7fc0d4; --accent-soft:#1d313a; --key:#e3b56a; --key-soft:#2d2416; color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:400 1.0625rem/1.55 var(--body);padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4vw,2.5rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.55rem;font-weight:700;margin-bottom:.75rem}
h3{font-size:1.15rem;font-weight:700;margin-top:2rem;margin-bottom:.6rem}
h4{font-size:1rem;font-weight:700;margin-top:1.4rem;margin-bottom:.4rem}
p{margin:.6rem 0;max-width:68ch}
.muted{color:var(--muted)} .small{font-size:.9rem}
.eyebrow,.kicker,.brieftag{font:500 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 .6rem}
.top{padding-block:8px 20px}
.lede{color:var(--muted);font-size:1.08rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:28px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2;padding-top:8px}
.tabs button{font:600 .92rem/1 var(--body);color:var(--muted);background:transparent;border:1px solid transparent;border-radius:6px;padding:9px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--fg);border-color:var(--line)}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.tabs button:focus-visible,summary:focus-visible,.lock button:focus-visible,.lock input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seat{font:500 .66rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.tablewrap{overflow-x:auto;margin:.8rem 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
thead th{font:600 .78rem/1.2 var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tbody th{font-weight:600}
.facts th{width:44%;font-weight:400;color:var(--muted)}
.num{font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums}
.rubric{min-width:720px}
.rubric td,.rubric th{font-size:.88rem}
.langbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-14px 0 24px;font-size:.9rem;color:var(--muted)}
.langbar button{font:600 .85rem/1 var(--body);padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
.langbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.langbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.callout{background:var(--accent-soft);border-radius:8px;padding:14px 16px;max-width:none}
.slides{list-style:none;padding:0;margin:.6rem 0;display:grid;gap:8px;counter-reset:s}
.slides li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr;gap:4px 10px;align-items:baseline}
.slides li::before{content:counter(s);font:500 .85rem/1 var(--mono);color:var(--accent);grid-row:span 2}
.slides li span{font-weight:600}
.checks{padding-left:1.2rem}
.brief{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:clamp(18px,4vw,32px);margin-top:1rem}
.brief ol,.brief ul{padding-left:1.3rem}
.brief li{margin:.25rem 0}
.quotes{list-style:none;padding:0!important;display:grid;gap:10px}
.quotes li{display:grid;gap:2px}
.who{font:500 .72rem/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
q{font-style:italic}
.rules{border-top:1px solid var(--line);padding-top:12px;margin-top:1.2rem;font-size:.95rem;color:var(--muted);max-width:none}
.key{margin-top:18px;background:var(--key-soft);border-radius:10px;padding:4px 18px 14px}
.key summary{cursor:pointer;font:700 1rem/1.3 var(--display);color:var(--key);padding:12px 0;list-style-position:inside}
.key summary span{font:500 .7rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;margin-left:8px;opacity:.85}
.key table th,.key table td{border-color:color-mix(in srgb,var(--key) 25%,transparent)}
.lock{min-height:70vh;display:grid;place-items:center}
.lock form{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:360px;display:grid;gap:12px}
.lock label{font-weight:600}
.lock input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.lock button{font:600 1rem/1 var(--body);padding:11px 14px;border:0;border-radius:8px;background:var(--accent);color:var(--paper);cursor:pointer}
.lock .err{color:#b3261e;min-height:1.3em;margin:0;font-size:.92rem}
:root[data-theme="dark"] .lock .err{color:#ff8a80}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lock .err{color:#ff8a80}}
@media (max-width:560px){.facts th{width:auto}.facts tr{display:grid}.facts th{border-bottom:0;padding-bottom:0}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style></head><body>

<div class="lock" id="lock">
<form id="lockform" autocomplete="off">
<p class="eyebrow">Private page</p>
<label for="pw">Password</label>
<input id="pw" type="password" autofocus>
<button type="submit">Open</button>
<p class="err" id="err" role="alert"></p>
</form>
</div>
<main id="app" hidden></main>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
return await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
function show(id){
document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === id)));
document.querySelectorAll(".panel").forEach(p => p.hidden = p.dataset.panel !== id);
try { sessionStorage.setItem("kit-tab", id); } catch(e) {}
}
function setLang(l){
document.querySelectorAll("[data-setlang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.setlang === l)));
document.querySelectorAll("article[data-lang]").forEach(a => a.hidden = a.dataset.lang !== l);
try { localStorage.setItem("kit-lang", l); } catch(e) {}
}
function mount(html){
const app = document.getElementById("app");
app.innerHTML = html; app.hidden = false;
document.getElementById("lock").hidden = true;
app.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { show(b.dataset.tab); window.scrollTo({top:0}); }));
let start = "overview";
try { start = sessionStorage.getItem("kit-tab") || start; } catch(e) {}
if (!app.querySelector(`[data-panel="${start}"]`)) start = "overview";
show(start);
